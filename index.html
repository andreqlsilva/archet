<script type="module">
  import { Root, Crud, Text } from 'http://localhost:8000/archet.js';

  const app = new Root().bg("#f4f4f4").pad(40);
  
  // We extend Crud to talk to the server
  class NetworkCrud extends Crud {
    constructor() {
      super("Server Data", ["message"]);
      this.refresh();
    }

    async refresh() {
      const res = await fetch("/api/data");
      this.data = await res.json(); // Update Source of Truth
      this.renderList();            // Update UI
    }

    async addItem() {
      const msg = this.inputs["message"].val;
      if (!msg) return;

      // 1. Send to Server
      await fetch("/api/data", {
        method: "POST",
        body: JSON.stringify({ message: msg })
      });
      
      // 2. Clear & Refresh
      this.inputs["message"].val = "";
      this.refresh();
    }

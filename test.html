<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Archet v10 Test Suite</title>
    <style>
        /* Test Runner UI */
        body { font-family: monospace; background: #111; color: #ddd; padding: 20px; margin: 8px; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .pass { color: #5f5; margin: 4px 0; }
        .fail { color: #f55; margin: 4px 0; font-weight: bold; background: rgba(255,0,0,0.1); padding: 5px; }
        .error-trace { color: #f88; margin-left: 20px; font-size: 0.9em; white-space: pre-wrap; }
        
        #stage { border: 1px dashed #444; padding: 10px; margin-top: 20px; opacity: 0.5; }
        #scratch { display: none; } 
    </style>
</head>
<body>

<h1>Archet v10 Diagnostics</h1>
<div id="report"></div>
<div id="stage"></div>
<div id="scratch"></div>

<script type="module">
    import { Root, Box, Button, Input, Crud, Deck, Split, Component } from './archet.js';

    // --- 1. THE HARNESS ---
    const report = document.getElementById('report');
    const stage = document.getElementById('stage');
    const scratch = document.getElementById('scratch');
    
    const testQueue = [];
    function test(name, fn) { testQueue.push({ name, fn }); }

    function fmt(v) {
        if (v instanceof Element) {
            let s = `<${v.tagName.toLowerCase()}`;
            if (v.id) s += `#${v.id}`;
            if (v.className) s += `.${v.className.replace(/\s+/g, ".")}`;
            return s + ">";
        }
        if (typeof v === "object" && v !== null) {
            try { return JSON.stringify(v); }
            catch (e) { return Object.prototype.toString.call(v); }
        }
        return String(v);
    }

    const expect = (actual) => ({
        toBe: (expected) => {
            if (actual !== expected) throw new Error(`Expected ${fmt(expected)}, got ${fmt(actual)}`);
        },
        toBeTruthy: () => {
            if (!actual) throw new Error(`Expected truthy, got ${fmt(actual)}`);
        },
        toMatch: (regex) => {
             if (!(regex instanceof RegExp)) throw new Error("toMatch() expects a RegExp");
             if (!regex.test(String(actual))) throw new Error(`Expected "${actual}" to match ${regex}`);
        },
        toThrow: (errorFragment) => {
            if (typeof actual !== "function") throw new Error("toThrow() expects a function.");
            try { actual(); } 
            catch (e) {
                if (!e.message.includes(errorFragment)) throw new Error(`Expected error containing "${errorFragment}", got "${e.message}"`);
                return;
            }
            throw new Error(`Expected function to throw "${errorFragment}", but it succeeded.`);
        },
        toHaveBg: (expectedHex) => {
            const expectedRGB = normalizeColor(expectedHex, "backgroundColor");
            const actualRGB = getComputedStyle(actual).backgroundColor;
            if (actualRGB !== expectedRGB) throw new Error(`Expected BG ${expectedRGB} (${expectedHex}), got ${actualRGB}`);
        },
        toHaveFg: (expectedHex) => {
            const expectedRGB = normalizeColor(expectedHex, "color");
            const actualRGB = getComputedStyle(actual).color;
            if (actualRGB !== expectedRGB) throw new Error(`Expected FG ${expectedRGB} (${expectedHex}), got ${actualRGB}`);
        }
    });

    function normalizeColor(hex, prop) {
        const d = document.createElement("div");
        d.style[prop] = hex;
        scratch.appendChild(d);
        const rgb = getComputedStyle(d)[prop];
        d.remove();
        return rgb;
    }

    async function runTests() {
        let passed = 0;
        for (const t of testQueue) {
            stage.innerHTML = "";
            scratch.innerHTML = "";
            try {
                await t.fn();
                log(t.name, true);
                passed++;
            } catch (e) {
                console.error(e);
                log(t.name, false, e);
            }
        }
        
        const summary = document.createElement('div');
        summary.style.marginTop = "20px";
        summary.style.borderTop = "1px solid #444";
        summary.innerHTML = `<h3>Result: ${passed}/${testQueue.length} passed</h3>`;
        report.appendChild(summary);
    }

    function log(name, success, err) {
        const div = document.createElement("div");
        div.className = success ? "pass" : "fail";
        if (success) {
            div.textContent = `✔ ${name}`;
        } else {
            const msg = document.createTextNode(`✘ ${name}`);
            const trace = document.createElement("div");
            trace.className = "error-trace";
            trace.textContent = `${err.message}\n${err.stack}`;
            div.appendChild(msg);
            div.appendChild(trace);
        }
        report.appendChild(div);
    }

    // --- 2. THE TESTS ---

    test("Root: Polite Reset & Style Injection", () => {
        // 1. Mount to stage (should NOT touch body margin)
        const initialMargin = getComputedStyle(document.body).margin;
        const root = new Root("stage");
        const finalMargin = getComputedStyle(document.body).margin;
        
        expect(finalMargin).toBe(initialMargin);

        // 2. Check Style Injection
        const styleTag = document.getElementById("archet-styles");
        expect(styleTag).toBeTruthy();
        
        // 3. Ensure we don't duplicate it
        new Root("stage"); // Second instance
        expect(document.querySelectorAll("#archet-styles").length).toBe(1);
    });

    test("Component: Hide/Show restores display", () => {
        const b = new Box().css({ display: "grid" });
        stage.appendChild(b.dom);
        
        // It starts as grid
        expect(b.dom.style.display).toBe("grid");
        
        // Hide it
        b.hide();
        expect(b.dom.style.display).toBe("none");
        
        // Show it (should restore grid, not default to flex/block)
        b.show();
        expect(b.dom.style.display).toBe("grid");
    });

    test("Split: Wraps raw DOM nodes safely", () => {
        const split = new Split(50, 50);
        const raw = document.createElement("div");
        raw.textContent = "Raw";
        
        split.add(raw, "Right");
        stage.appendChild(split.dom);
        
        // 1. Should have 2 children (Wrapped Raw + Text "Right")
        expect(split.dom.children.length).toBe(2);
        
        // 2. The first child should be a wrapper DIV (flex column)
        const wrapper = split.dom.children[0];
        expect(wrapper.tagName).toBe("DIV");
        expect(wrapper.style.flexDirection).toBe("column");
        
        // 3. The wrapper should contain our raw node
        expect(wrapper.firstElementChild).toBe(raw);
    });

    test("Core: Hierarchy & Primitives", () => {
        const box = new Box();
        box.add(new Button("A"), document.createElement("span"), "Text");
        box.add(null, undefined); 
        stage.appendChild(box.dom);
        expect(box.dom.children.length).toBe(3);
    });

    test("Style: Macros (FG vs BG)", () => {
        const btn = new Button("Red").bg("#ff0000").fg("#00ff00");
        stage.appendChild(btn.dom); 
        expect(btn.dom).toHaveBg("#ff0000"); 
        expect(btn.dom).toHaveFg("#00ff00");
    });

    test("Input: Deterministic IDs & Focus", () => {
        Input.uid = 0; 
        const inp = new Input("A", 1, "Label A");
        stage.appendChild(inp.dom);
        
        expect(inp.input.dom.id).toMatch(/^inp-\d+$/);
        expect(inp.input.dom.id).toBe("inp-0");

        const label = inp.dom.querySelector("label");
        label.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        expect(document.activeElement).toBe(inp.input.dom);
    });

    test("Deck: Validation Guard", () => {
        const deck = new Deck();
        deck.add(new Box()); 
        expect(deck.items.length).toBe(1);
        expect(() => deck.add(document.createElement("div"))).toThrow("Only Archet Components");
    });

    test("CRUD: Contract-based Deletion", () => {
        const crud = new Crud("Users", ["Name"]);
        crud.onError = () => {}; 
        stage.appendChild(crud.dom);

        crud.inputs["Name"].val = "Alice";
        crud.addItem();
        expect(crud.data.length).toBe(1);
        
        const deleteBtn = crud.list.dom.querySelector('[data-role="delete"]');
        expect(deleteBtn).toBeTruthy();
        
        deleteBtn.click();
        expect(crud.data.length).toBe(0);
    });

    test("Split: Flex Computation", () => {
        const split = new Split(50, 50);
        split.add("Left", "Right"); 
        stage.appendChild(split.dom);
        const left = split.dom.children[0];
        expect(Number(getComputedStyle(left).flexGrow)).toBe(50);
        expect(left.textContent).toBe("Left");
    });

    test("Component: hide/show restores inline display", () => {
      const b = new Box().css({ display: "grid" });
      stage.appendChild(b.dom);
      b.hide(); b.show();
      expect(b.dom.style.display).toBe("grid");
    });


    // --- 3. EXECUTE ---
    runTests();

</script>
</body>
</html>
